<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <!-- Page Title -->
  <div style="text-align:center; margin-bottom:15px;">
    <h1 style="font-size:32px;font-family: Playfair Display'; color:#333; margin:0;">Unicamp's Restaurants - Dashboard</h1>
<style>

    margin:0; 
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#f4f6f8; 
    display:flex;

    display:flex;

  text-align: center;
  padding: 10px 20px;

  background: #fff;

}

#occupancy-bar-bg {

  margin: 0 auto;

}

#occupancy-bar {
  height: 100%;
  width: 0%;
  background: #4CAF50;
  border-radius: inherit;

}

#occupancy-label {
  font-weight: bold;
  color: #333;
  margin-top: 5px;
  font-size: 14px;
}

  #map-wrapper { 
    flex:2; 
    position:relative; 
    border-right:2px solid #e0e0e0; 
    border-radius:12px 0 0 0; 
    overflow:hidden; 
  }

  #map { 
    width:100%; 
    height:100%; 
    border-radius:inherit; 
  }

  #right-panel {
    flex:1;
    display:flex;
    flex-direction:column;
    padding:15px;

    background:#fafafa;

    height:100%;

  #bottom-section {

    height:100%;

  select {

  padding: 5px 0px;      /* Make it taller */

<script>
// --- Leaflet Map ---
const map = L.map('map', {
  zoomControl:false, scrollWheelZoom:false, doubleClickZoom:false,
  boxZoom:false, keyboard:false
}).setView([-22.818, -47.067],16);

L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; Stadia Maps'
}).addTo(map);

// --- Polygons & Labels ---
const echartsLayer = L.DomUtil.create('div','echarts-layer', map.getPanes().overlayPane);
echartsLayer.style.position='absolute';
echartsLayer.style.pointerEvents='auto';
const chartMapOverlay = echarts.init(echartsLayer);

const polygons=[
  {name:"Restaurante Universitário", coords:[[-22.8179271,-47.0723574],[-22.8177786,-47.0718485],[-22.817512,-47.0719035],[-22.817372,-47.0719341],[-22.817207,-47.0719744],[-22.817261,-47.0722476],[-22.817311,-47.0725007],[-22.8179271,-47.0723574]]},
  {name:"Restaurante Administrativo", coords:[[-22.8224543,-47.0652258],[-22.8224905,-47.0651924],[-22.8225801,-47.0651098],[-22.8225289,-47.0650443],[-22.8225632,-47.0650126],[-22.8224665,-47.0648892],[-22.8223063,-47.0650369],[-22.8224543,-47.0652258]]},
  {name:"Restaurante da Saturnino", coords:[[-22.8151011,-47.0625684],[-22.8154739,-47.0624904],[-22.8154207,-47.0621915],[-22.8150479,-47.0622695],[-22.8151011,-47.0625684]]}
];

function projectPolygon(poly){
  return poly.coords.map(c=>{
    const p=map.latLngToLayerPoint([c[0],c[1]]);
    return [p.x,p.y];
  });
}

function getPolygonCentroid(coords) {
  let xSum = 0, ySum = 0;
  coords.forEach(p => { xSum += p[0]; ySum += p[1]; });
  return [xSum / coords.length, ySum / coords.length];
}

function updateTextBoxBorder() {
    if (!predictionData) return;

    const maxCapacity = 8000; // same scaling as your predicted bars
    let totalTomorrow = 0;

    // Get lunch and dinner indices
    const lunchIndex = predictionData.MealType.findIndex(mt => mt === "lunch");
    const dinnerIndex = predictionData.MealType.findIndex(mt => mt === "dinner");

    ["RU-A", "RU-B", "RA", "RS"].forEach(key => {
        const lunchVal = parseFloat(predictionData[key][lunchIndex]) || 0;
        const dinnerVal = parseFloat(predictionData[key][dinnerIndex]) || 0;
        totalTomorrow += lunchVal + dinnerVal;
    });

    const percent = (totalTomorrow / maxCapacity) * 100;

    const box = document.getElementById("predicted-text-box");
    if (percent > 80) box.style.borderColor = "#D32F2F"; // red
    else if (percent > 40) box.style.borderColor = "#FFA726"; // yellow
    else box.style.borderColor = "#2E7D32"; // green
}

function updatePolygons(){
  const seriesData = polygons.map(poly=>({
    name: poly.name,
    type:'custom',
    renderItem:(params, api)=>{
      const points = projectPolygon(poly);
      const [cx, cy] = getPolygonCentroid(points);
      return {
        type:'group',
        children:[
          { 
            type:'polygon', 
            shape:{points}, 
            style:api.style({
                fill: poly.fillColor || 'rgba(46,125,50,0.2)', 
                stroke: poly.strokeColor || '#555', // <-- use strokeColor
                lineWidth:3
            }) 
          },
          { type:'text', style:{
              text: poly.name,
              x: cx,
              y: cy - 50,
              fill: '#222',
              font: 'bold 18px Verdana, sans-serif',
              align: 'center',
              textBackgroundColor: 'rgba(255,255,255,0.85)',
              padding: [4, 10],
              borderRadius: 6,
              textBorderColor: '#555',
              textBorderWidth: 1
          }}
        ]
      };
    },
    data:[0]
  }));
  
  chartMapOverlay.setOption({
    xAxis:{show:false, min:0, max:map.getSize().x, type:'value'},
    yAxis:{show:false, min:0, max:map.getSize().y, inverse:true, type:'value'},
    series: seriesData
  });
}

function resizeOverlay(){
  const size=map.getSize();
  echartsLayer.style.width=size.x+'px';
  echartsLayer.style.height=size.y+'px';
  chartMapOverlay.resize();
  updatePolygons();
}

map.on('move',updatePolygons);
map.on('zoom',resizeOverlay);
map.on('resize',resizeOverlay);
resizeOverlay();

chartMapOverlay.getZr().on('click', params=>{
  const x=params.offsetX, y=params.offsetY;
  polygons.forEach(poly=>{
    if(isPointInPolygon([x,y], projectPolygon(poly))){
      updateDropdownForPolygon(poly.name);
    }
  });
});

function isPointInPolygon(point,vs){
  let inside=false;
  const x=point[0],y=point[1];
  for(let i=0,j=vs.length-1;i<vs.length;j=i++){
    const xi=vs[i][0],yi=vs[i][1];
    const xj=vs[j][0],yj=vs[j][1];
    const intersect = ((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi+1e-9)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

function updateDropdownForPolygon(name){
  const dropdown=document.getElementById('graph-select');
  if(name==="Restaurante Universitário") dropdown.value='RU-A';
  else if(name==="Restaurante Administrativo") dropdown.value='RA';
  else if(name==="Restaurante da Saturnino") dropdown.value='RS';
  updateChart();
  updateHeatmap();
  updateOccupancyBar(name);
}
function updateTextBoxNow() {
    if (!csvData || !csvData.length) return;

    const lastRow = csvData[csvData.length - 1];
    const temperature = parseFloat(lastRow.Temperature || 0);
    const humidity = parseFloat(lastRow.Humidity || 0);

    const box = document.getElementById("predicted-text-box");

    let warn = "No alerts.";
    let warning = "Temperature and humidity are comfortable.";
    let borderColor = "#2E7D32"; // green
    let iconUrl = "icons/ok.png";

    if (temperature > 35 && humidity > 70) {
        warn = "Danger:";
        warning = "High temperature and humidity! Risk of heat exhaustion! Bring water and umbrellas if you plan to stay on the line.";
        borderColor = "#D32F2F";
        iconUrl = "icons/fire.png";
    } else if (temperature > 25 && humidity > 50) {
        warn = "Caution:";
        warning = "High temperature and humidity. Bring some water and do not overstay in the sun.";
        borderColor = "#FFA726";
        iconUrl = "icons/danger.png";
    }

    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const openIntervals = [
        [7 * 60, 8 * 60 + 30],
        [10 * 60 + 30, 14 * 60],
        [17 * 60 + 30, 19 * 60],
        [11 * 60 + 15, 14 * 60],
        [17 * 60 + 30, 19 * 60]
    ];

    const isOpen = openIntervals.some(interval =>
        currentMinutes >= interval[0] && currentMinutes <= interval[1]
    );
    const statusText = isOpen ? "Restaurants are OPEN" : "Restaurants are CLOSED";

    // --- Flexbox with proper alignment ---
    box.style.borderColor = borderColor;
    box.innerHTML = `
        <div style="display:flex; align-items:center; gap:100px; padding-left:20px;">
            <img src="${iconUrl}" style="width:60px; height:60px; flex-shrink:0;">
            <div style="display:flex; flex-direction:column; justify-content:center; margin-left:10px;">
                <p style="margin:2px 0; font-size:14px;"><strong>Temperature:</strong> ${temperature.toFixed(1)}°C</p>
                <p style="margin:2px 0; font-size:14px;"><strong>Humidity:</strong> ${humidity.toFixed(1)}%</p>
                <p style="margin:2px 0; font-size:14px;"><strong>${warn}</strong> ${warning}</p>
                <p style="margin:2px 0; font-size:14px;"><strong>Status:</strong> ${statusText}</p>
            </div>
        </div>
    `;
}



function updateOccupancyBar(selectedName) {
  if (!csvData || !csvData.length) return;

  const lastRow = csvData[csvData.length - 1];
  if (!lastRow) return;

  let current = 0;
  let displayName = selectedName;

  if (selectedName === "Restaurante Universitário") {
    // sum RU-A + RU-B
    const ruA = parseFloat(lastRow["RU-A"]) || 0;
    const ruB = parseFloat(lastRow["RU-B"]) || 0;
    current = ruA + ruB;
    displayName = "Restaurante Universitário (RU-A + RU-B)";
  } else if (selectedName === "Restaurante Administrativo") {
    current = parseFloat(lastRow["RA"]) || 0;
  } else if (selectedName === "Restaurante da Saturnino") {
    current = parseFloat(lastRow["RS"]) || 0;
  } else {
    return;
  }

  const maxCapacity = 20; // for bar scaling, adjust if needed
  const barWidth = Math.min((current / maxCapacity) * 100, 100);

  const bar = document.getElementById("occupancy-bar");
  const label = document.getElementById("occupancy-label");

  bar.style.width = barWidth + "%";
  if (barWidth > 80) bar.style.background = "#D32F2F"; // red
  else if (barWidth > 40) bar.style.background = "#FFA726"; // yellow
  else bar.style.background = "#2E7D32"; // green
  if(current === 1) label.textContent = `${displayName}: ${current} person`;
  else label.textContent = `${displayName}: ${current} people`;

}


function updateOccupancyBarFromDropdown() {
  const dropdown = document.getElementById('graph-select');
  const value = dropdown.value;

  const reverseMap = {
    "RA": "Restaurante Administrativo",
    "RS": "Restaurante da Saturnino",
    "RU-A": "Restaurante Universitário",
    "RU-B": "Restaurante Universitário" // if you want RU-B treated separately, can add new name
  };

  const restaurantName = reverseMap[value];
  if (restaurantName) updateOccupancyBar(restaurantName);
}

let predictionFilter = null; // null = all, 'RU-A', 'RU-B', 'RA', 'RS'

function updatePredictionDisplay() {
    if (!predictionData) return;

    const container = document.getElementById('predicted-bars');
    container.innerHTML = ''; // clear previous display

    const maxCapacity = 1000;

    // Define restaurants
    let restaurants = [
        { name: "RU-A + RU-B", keys: ["RU-A", "RU-B"] },
        { name: "RA", keys: ["RA"] },
        { name: "RS", keys: ["RS"] }
    ];

    // Apply filter
    if (predictionFilter) {
        if (predictionFilter === "RU") {
            restaurants = [
                { name: "RU-A", keys: ["RU-A"] },
                { name: "RU-B", keys: ["RU-B"] }
            ];
        } else {
            restaurants = restaurants.filter(r => r.keys.includes(predictionFilter));
        }
    }

    restaurants.forEach(r => {
        const lunchIndex = predictionData.MealType.findIndex(mt => mt === "lunch");
        const dinnerIndex = predictionData.MealType.findIndex(mt => mt === "dinner");

        const meals = [
            { type: "Lunch", index: lunchIndex },
            { type: "Dinner", index: dinnerIndex }
        ];

        // Row container
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.alignItems = 'center';
        row.style.margin = '8px 0';
        row.style.justifyContent = 'flex-start';
        row.style.width = '80%';
        row.style.marginLeft = 'auto';
        row.style.marginRight = 'auto';

        // Restaurant name label
        const nameLabel = document.createElement('div');
        nameLabel.textContent = r.name;
        nameLabel.style.fontWeight = 'bold';
        nameLabel.style.fontSize = '14px';
        nameLabel.style.color = '#333';
        nameLabel.style.width = '160px'; // fixed width for alignment
        row.appendChild(nameLabel);

        // Create circles for lunch and dinner
        meals.forEach(meal => {
            const value = r.keys.reduce((sum, key) => sum + (parseFloat(predictionData[key][meal.index]) || 0), 0);
            const percent = Math.min((value / maxCapacity) * 100, 100);

            let color = '';
            if (percent > 90) color = "#D32F2F";       // red
            else if (percent > 75) color = "#FFA726";  // orange
            else if (percent > 50) color = "#66BB6A";  // medium green
            else if (percent > 25) color = "#C8E6C9";  // light green
            else color = "#E8F5E9";                    // light green

            const mealContainer = document.createElement('div');
            mealContainer.style.display = 'flex';
            mealContainer.style.alignItems = 'center';
            mealContainer.style.marginRight = '12px';

            const circle = document.createElement('div');
            circle.style.width = '25px';
            circle.style.height = '25px';
            circle.style.borderRadius = '50%';
            circle.style.background = color;
            circle.style.marginRight = '6px';

            const label = document.createElement('div');
            label.textContent = `${meal.type}: ${Math.round(value)}`;
            label.style.fontSize = '12px';
            label.style.color = '#333';
            label.style.width = '60px';        // fixed width
            label.style.textAlign = 'left';    // ensure the circle stays fixed

            mealContainer.appendChild(circle);
            mealContainer.appendChild(label);
            row.appendChild(mealContainer);
        });

        container.appendChild(row);
    });
}




// --- Update filter on polygon click ---
function updatePredictionFilter(name) {
    if (name === "Restaurante Universitário") {
        predictionFilter = "RU"; // show RU-A and RU-B separately
    } else if (name === "Restaurante Administrativo") {
        predictionFilter = "RA";
    } else if (name === "Restaurante da Saturnino") {
        predictionFilter = "RS";
    } else {
        predictionFilter = null;
    }
    updatePredictionDisplay();
}

// Example: integrate with map click
chartMapOverlay.getZr().on('click', params=>{
  const x=params.offsetX, y=params.offsetY;
  polygons.forEach(poly=>{
    if(isPointInPolygon([x,y], projectPolygon(poly))){
      updateDropdownForPolygon(poly.name);
      updatePredictionFilter(poly.name); // <-- update the bar filter
    }
  });
});




// --- Charts & Heatmap ---
const chartRight = echarts.init(document.getElementById('chart'));
const heatmap = echarts.init(document.getElementById('heatmap'));
let csvData=[], timeLabels=[], selectedDay=null, uniqueDays=[];

async function fetchCSV(){
  try{
    const res=await fetch('https://nana.tail7c9f88.ts.net/line.csv');
    const text=await res.text();
    parseCSV(text);
    updateChart();
    updateHeatmap();
    updatePolygonsColors();
    const currentDropdown = document.getElementById('graph-select').value;
const currentRestName = Object.keys({
  "Restaurante Universitário": "RU-A",
  "Restaurante Administrativo": "RA",
  "Restaurante da Saturnino": "RS"
}).find(k => ({
  "Restaurante Universitário": "RU-A",
  "Restaurante Administrativo": "RA",
  "Restaurante da Saturnino": "RS"
}[k] === currentDropdown));

if (currentRestName) updateOccupancyBar(currentRestName);

  }catch(e){ console.error('Failed to fetch CSV:', e); }
}

function parseCSV(text){
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',');
  csvData = lines.slice(1).map(line => {
    const vals = line.split(',');
    let obj = {};
    headers.forEach((h,i)=>{ obj[h]=vals[i]; });
    return obj;
  });
  timeLabels = csvData.map(d=>d.HourMinSec);

  const daySet = new Set(csvData.map(d=>d.Day));
  uniqueDays = Array.from(daySet);
  uniqueDays.sort((a,b)=>new Date(a.replace(/:/g,'-')) - new Date(b.replace(/:/g,'-')));
}

function updateChart(){
  const metric=document.getElementById('graph-select').value;
  let filteredData = csvData;
  if(selectedDay) filteredData = csvData.filter(d=>d.Day===selectedDay);
  const xData = filteredData.map(d=>d.HourMinSec);
  const yData = filteredData.map(d=>parseFloat(d[metric]));
  chartRight.setOption({
    title:{ text: metric + (selectedDay ? ' (Day '+selectedDay+') - Time Series':' - Time Series'), left:'center', textStyle:{fontSize:18} },
    tooltip:{ 
      trigger:'axis',
      backgroundColor:'rgba(50,50,50,0.8)',
      textStyle:{color:'#fff', fontWeight:'bold'}
    },
    xAxis:{ type:'category', data:xData, name:'Time', axisLine:{lineStyle:{color:'#888'}} },
    yAxis:{ type:'value', name:metric, axisLine:{lineStyle:{color:'#2E7D32'}} },
    series:[{
      type:'line',
      data:yData,
      smooth:true,
      lineStyle:{ width:3, color:'#4CAF50' },
      areaStyle:{ color:'rgba(76, 175, 80, 0.2)' },
      symbolSize:6
    }]
  });
}

function pad(n){ return String(n).padStart(2,'0'); }
function parseDayToDate(s){ const [y,m,d] = s.split(':'); return new Date(+y, +m-1, +d); }
function formatDateColon(d){ return d.getFullYear()+':'+pad(d.getMonth()+1)+':'+pad(d.getDate()); }

function getAggMode(metric){ const avgMetrics = new Set(['Temperature','Humidity','WindSpeed','Pressure']); return avgMetrics.has(metric)?'avg':'sum'; }

function aggregateDaily(metric){
  const mode=getAggMode(metric);
  const map = new Map();
  for(const r of csvData){
    const v=parseFloat(r[metric]); if(!isFinite(v)) continue;
    const day=r.Day;
    if(!map.has(day)) map.set(day,{sum:0,count:0});
    const obj=map.get(day);
    obj.sum+=v; obj.count+=1;
  }
  if(map.size===0) return {days:[], values:[]};

  const presentDates = Array.from(map.keys()).map(parseDayToDate);
  const minDate = new Date(Math.min(...presentDates));
  const maxDate = new Date(Math.max(...presentDates));

  const days=[]; const values=[];
  for(let dt = new Date(minDate); dt <= maxDate; dt.setDate(dt.getDate()+1)){
    const key=formatDateColon(dt);
    days.push(key);
    if(map.has(key)){
      const {sum,count}=map.get(key);
      values.push(mode==='avg'?sum/count:sum);
    } else { values.push(0); }
  }
  return {days, values};
}

function updateHeatmap(){
  if(!csvData.length) return;
  const metric=document.getElementById('graph-select').value;
  const {days, values}=aggregateDaily(metric);
  if(days.length===0) return;

  const first=parseDayToDate(days[0]);
  const weekdays=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const cells=[]; const dayMap={}; let maxVal=0;

  for(let i=0;i<days.length;i++){
    const day=days[i]; const val=values[i]||0;
    const date=parseDayToDate(day);
    const diffDays=Math.round((date-first)/86400000);
    const weekIndex=Math.floor(diffDays/7);
    const weekday=date.getDay();
    cells.push([weekIndex,weekday,val,day]);
    dayMap[`${weekIndex}-${weekday}`]=day;
    if(val>maxVal) maxVal=val;
  }

  const positiveVals=values.filter(v=>isFinite(v)).sort((a,b)=>a-b);
  const q95=positiveVals.length?positiveVals[Math.floor(0.95*(positiveVals.length-1))]:maxVal;
  const vmax=Math.max(q95||0,maxVal||0)||1;

  heatmap.setOption({
    tooltip:{
      formatter:p=>{ const day=cells[p.dataIndex][3]; const v=Number(p.data[2]); return `${day}<br>${metric}: ${isFinite(v)?v.toFixed(2):'—'}`; }
    },
    xAxis:{ type:'category', data:Array.from({length:Math.max(...cells.map(c=>c[0]))+1},(_,i)=>i), name:'Week' },
    yAxis:{ type:'category', data:weekdays, inverse:true, name:'Weekday' },
    series:[{
      type:'heatmap',
      data:cells.map(c=>[c[0],c[1],c[2]]),
      label:{show:false},
      emphasis:{ itemStyle:{ borderWidth:1, borderColor:'#999' } }
    }],
    visualMap:{
      min:0,
      max:vmax,
      calculable:true,
      orient:'horizontal',
      left:'center',
      top:'top',
      inRange:{ color:['#F1F8E9','#C5E1A5','#81C784','#388E3C','#1B5E20'] },
      textStyle:{ fontSize:12, color:'#333', fontWeight:'bold' }
    }
  });

  heatmap.off('click');
  heatmap.on('click', function(params){
    const key=params.data[0]+'-'+params.data[1];
    const day=dayMap[key];
    if(day){ selectedDay=day; updateChart(); }
  });
}
document.getElementById('download-csv-btn').addEventListener('click', () => {
  if (!csvData || !csvData.length) {
    alert("CSV data not loaded yet.");
    return;
  }

  const headers = Object.keys(csvData[0]);
  const rows = csvData.map(row => headers.map(h => row[h]).join(','));
  const csvContent = [headers.join(','), ...rows].join('\n');

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);

  const link = document.createElement('a');
  link.href = url;
  link.download = 'unicamp_restaurants_data.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
});

function updatePolygonsColors() {
    if (!csvData || !csvData.length) return;

    const lastRow = csvData[csvData.length - 1];
    const maxCapacity = 20; // adjust as needed

    polygons.forEach(poly => {
        let value = 0;
        if (poly.name === "Restaurante Universitário") {
            value = (parseFloat(lastRow["RU-A"])||0) + (parseFloat(lastRow["RU-B"])||0);
        } else if (poly.name === "Restaurante Administrativo") {
            value = parseFloat(lastRow["RA"]) || 0;
        } else if (poly.name === "Restaurante da Saturnino") {
            value = parseFloat(lastRow["RS"]) || 0;
        }

        // keep fill color constant
        poly.fillColor = 'rgba(46,125,50,0.2)'; 

        // change stroke color based on occupancy
        if (value / maxCapacity > 0.8) poly.strokeColor = '#D32F2F'; // red
        else if (value / maxCapacity > 0.5) poly.strokeColor = '#FFA726'; // orange
        else poly.strokeColor = '#2E7D32'; // green
    });

    updatePolygons(); // redraw
}
